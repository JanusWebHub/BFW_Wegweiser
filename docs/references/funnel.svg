<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 1000" width="700" height="1000" font-family="Inter, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>The funnel algorithm over the east wing</title>
  <desc>Three steps of the funnel along the route from E.61 through Flur Nord, the Atrium and Flur Ost to E.57. Each panel shows the wedge of directions still available and the three values held.</desc>

  <style>
    .ttl   { font-size:13px; fill:#2b2b2b; font-weight:600; }
    .sub   { font-size:12px; fill:#5a5a5a; }
    .zone  { fill:#f4f2ed; stroke:#9a9a9a; stroke-width:1.5; }
    .circ  { fill:#e3eae7; stroke:#9a9a9a; stroke-width:1.5; }
    .zlbl  { font-size:11px; fill:#7a7a7a; letter-spacing:.5px; }
    .door  { stroke:#2b2b2b; stroke-width:5; stroke-linecap:round; }
    .doorF { stroke:#c9c9c9; stroke-width:5; stroke-linecap:round; }
    .doorX { stroke:#c25b3a; stroke-width:5; stroke-linecap:round; }
    .wedge { fill:#1f6f5c; fill-opacity:0.15; stroke:#1f6f5c; stroke-width:1; }
    .old   { fill:none; stroke:#bcd3cc; stroke-width:1; stroke-dasharray:4 3; }
    .fail  { fill:none; stroke:#c25b3a; stroke-width:1.5; stroke-dasharray:5 4; }
    .apex  { fill:#1f6f5c; stroke:#ffffff; stroke-width:2; }
    .pt    { fill:#2b2b2b; }
    .ptX   { fill:#c25b3a; }
    .path  { fill:none; stroke:#1f6f5c; stroke-width:4; }
    .co    { font-size:10px; fill:#5a5a5a; font-family:ui-monospace,Consolas,monospace; }
    .st    { font-size:11px; fill:#2b2b2b; font-family:ui-monospace,Consolas,monospace; }
    .stH   { font-size:10px; fill:#7a7a7a; }
    .box   { fill:#ffffff; stroke:#dcdcdc; stroke-width:1; }
  </style>

  <!-- ===================== panel 1 ===================== -->
  <g transform="translate(0,0)">
    <text class="ttl" x="20" y="24">1 — Leaving E.61, the opening into the Atrium sets both limits.</text>

    <rect class="zone" x="30"  y="34"  width="80"  height="52"/>
    <rect class="circ" x="0"   y="86" width="535" height="45"/>
    <rect class="circ" x="340" y="131" width="195" height="110"/>
    <rect class="circ" x="535" y="131" width="165" height="65"/>
    <rect class="zone" x="555" y="196" width="105" height="45"/>
    <text class="zlbl" x="70"  y="64"  text-anchor="middle">E.61</text>
    <text class="zlbl" x="170" y="113"  text-anchor="middle">FLUR NORD</text>
    <text class="zlbl" x="437" y="196" text-anchor="middle">ATRIUM</text>
    <text class="zlbl" x="620" y="168" text-anchor="middle">FLUR OST</text>
    <text class="zlbl" x="607" y="223" text-anchor="middle">E.57</text>

    <polygon class="wedge" points="55,86 480,131 400,131"/>
    <line class="doorF" x1="535" y1="151" x2="535" y2="191"/>
    <line class="doorF" x1="577" y1="196" x2="617" y2="196"/>
    <line class="door"  x1="400" y1="131" x2="480" y2="131"/>

    <circle class="apex" cx="55"  cy="86"  r="6"/>
    <circle class="pt"   cx="480" cy="131" r="4"/>
    <circle class="pt"   cx="400" cy="131" r="4"/>
    <text class="co" x="55"  y="78"  text-anchor="middle">(275,200)</text>
    <text class="co" x="488" y="146">(700,245) left</text>
    <text class="co" x="396" y="146" text-anchor="end">right (620,245)</text>

    <rect class="box" x="20" y="254" width="300" height="66" rx="5"/>
    <text class="stH" x="32" y="271">held</text>
    <text class="st"  x="32" y="288">apex (275,200)   left (700,245)</text>
    <text class="st"  x="32" y="305">lower/right (620,245)</text>
  </g>

  <!-- ===================== panel 2 ===================== -->
  <g transform="translate(0,330)">
    <text class="ttl" x="20" y="24">2 — The Atrium exit lies past the right limit. No straight line reaches it.</text>

    <rect class="zone" x="30"  y="34"  width="80"  height="52"/>
    <rect class="circ" x="0"   y="86" width="535" height="45"/>
    <rect class="circ" x="340" y="131" width="195" height="110"/>
    <rect class="circ" x="535" y="131" width="165" height="65"/>
    <rect class="zone" x="555" y="196" width="105" height="45"/>
    <text class="zlbl" x="70"  y="64"  text-anchor="middle">E.61</text>
    <text class="zlbl" x="170" y="113"  text-anchor="middle">FLUR NORD</text>
    <text class="zlbl" x="437" y="196" text-anchor="middle">ATRIUM</text>
    <text class="zlbl" x="620" y="168" text-anchor="middle">FLUR OST</text>
    <text class="zlbl" x="607" y="223" text-anchor="middle">E.57</text>

    <polygon class="wedge" points="55,86 480,131 400,131"/>
    <line class="fail" x1="55" y1="86" x2="535" y2="151"/>
    <line class="doorF" x1="577" y1="196" x2="617" y2="196"/>
    <line class="door"  x1="400" y1="131" x2="480" y2="131"/>
    <line class="doorX" x1="535" y1="151" x2="535" y2="191"/>

    <circle class="apex" cx="55"  cy="86"  r="6"/>
    <circle class="pt"   cx="400" cy="131" r="4"/>
    <circle class="ptX"  cx="535" cy="151" r="4"/>
    <text class="co" x="543" y="148">(755,265)</text>
    <text class="co" x="396" y="146" text-anchor="end">right (620,245)</text>
    <text class="co" x="300" y="106"  text-anchor="middle">blocked by the right limit</text>

    <rect class="box" x="20" y="254" width="300" height="66" rx="5"/>
    <text class="stH" x="32" y="271">test</text>
    <text class="st"  x="32" y="288">cross(v, v_right) = -825</text>
    <text class="st"  x="32" y="305">negative, so bend at right</text>
  </g>

  <!-- ===================== panel 3 ===================== -->
  <g transform="translate(0,660)">
    <text class="ttl" x="20" y="24">3 — The corner becomes the new apex. From there the target is in view.</text>

    <rect class="zone" x="30"  y="34"  width="80"  height="52"/>
    <rect class="circ" x="0"   y="86" width="535" height="45"/>
    <rect class="circ" x="340" y="131" width="195" height="110"/>
    <rect class="circ" x="535" y="131" width="165" height="65"/>
    <rect class="zone" x="555" y="196" width="105" height="45"/>
    <text class="zlbl" x="70"  y="64"  text-anchor="middle">E.61</text>
    <text class="zlbl" x="170" y="113"  text-anchor="middle">FLUR NORD</text>
    <text class="zlbl" x="437" y="196" text-anchor="middle">ATRIUM</text>
    <text class="zlbl" x="620" y="168" text-anchor="middle">FLUR OST</text>
    <text class="zlbl" x="607" y="223" text-anchor="middle">E.57</text>

    <polygon class="old"   points="55,86 480,131 400,131"/>
    <polygon class="wedge" points="400,131 535,151 535,191"/>
    <line class="doorF" x1="400" y1="131" x2="480" y2="131"/>
    <line class="door"  x1="535" y1="151" x2="535" y2="191"/>
    <line class="door"  x1="577" y1="196" x2="617" y2="196"/>
    <path class="path" d="M55 86 L400 131 L597 196"/>

    <circle class="apex" cx="55"  cy="86"  r="6"/>
    <circle class="apex" cx="400" cy="131" r="7"/>
    <circle class="apex" cx="597" cy="196" r="6"/>
    <text class="co" x="396" y="123" text-anchor="end">corner (620,245)</text>
    <text class="co" x="597" y="214" text-anchor="middle">(817,310)</text>

    <rect class="box" x="20" y="254" width="300" height="66" rx="5"/>
    <text class="stH" x="32" y="271">held</text>
    <text class="st"  x="32" y="288">apex (620,245)   left (755,265)</text>
    <text class="st"  x="32" y="305">right (755,305)</text>
  </g>
</svg>
