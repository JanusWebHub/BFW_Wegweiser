    <path d="M 0 0 L 10 5 L 0 10 z" fill="#087f8c"/>
  </marker>
  <marker id="arrow-east" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c45a25"/>
  </marker>
  <style>
    .caption { font: 700 7px Arial, sans-serif; fill: #28363a; }
    .label { font: 600 5.5px Arial, sans-serif; fill: #28363a; paint-order: stroke; stroke: #fff; stroke-width: 1.5px; stroke-linejoin: round; }
    .track-bed { fill: none; stroke: #fff; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
    .backbone { fill: none; stroke: #263d43; stroke-width: 6.5; stroke-linecap: round; stroke-linejoin: round; }
    .rail { fill: none; stroke: #d8a83c; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .connector-bed { fill: none; stroke: #fff; stroke-width: 9; stroke-linecap: round; }
    .connector { fill: none; stroke: #c45a25; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; }
    .connector-e09 { fill: none; stroke: #087f8c; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; }
    .route-highlight-bed { fill: none; stroke: #fff; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; }
    .route-highlight { fill: none; stroke: #d1492e; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    .choice-west { fill: none; stroke: #087f8c; stroke-width: 2.2; stroke-dasharray: 3 2; marker-end: url(#arrow-west); }
    .choice-east { fill: none; stroke: #c45a25; stroke-width: 2.2; stroke-dasharray: 3 2; marker-end: url(#arrow-east); }
  </style>
</defs>
