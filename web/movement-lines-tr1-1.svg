<svg xmlns="http://www.w3.org/2000/svg" width="100vw" height="100vh" viewBox="250 -170 550 400" role="img" aria-labelledby="title description" style="display:block">
<title id="title">Movement-line concept for E.flur-tr1-1</title>
<desc id="description">A plan crop around E.20 shows an authored angled connector from its door to a corridor backbone, with route choices in both directions.</desc>
<defs>
