<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plan Tracer</title>
<style>
  html, body { height: 100%; }
  body { margin: 0; font: 14px sans-serif; display: flex; background: #fff; color: #222; }
  #panel { width: 250px; padding: 8px; overflow-y: auto; border-right: 1px solid #aaa; box-sizing: border-box; }
  @media (max-width: 700px) {
    body { flex-direction: column; }
    #panel { width: 100%; max-height: 40%; border-right: 0; border-bottom: 1px solid #aaa; }
  }
  #panel fieldset { margin: 0 0 8px; padding: 6px; }
  #panel label { display: flex; justify-content: space-between; align-items: center; margin: 2px 0; }
  #panel input[type=number], #panel input[type=text] { width: 90px; }
  #panel button { margin: 2px 2px 2px 0; }
  #panel button.active { background: #cde; }
  #view { flex: 1; background: #fff; touch-action: none; }
</style>
</head>
<body>
<div id="panel">
  <fieldset>
    <legend>Floor</legend>
    <label>Floor ID <input type="text" id="floorId" value="EG"></label>
    <label>Level <input type="number" id="level" value="0" step="1"></label>
    <label>Frame x <input type="number" id="fx" value="0"></label>
    <label>Frame y <input type="number" id="fy" value="0"></label>
    <label>Frame width <input type="number" id="fw" value="1000"></label>
    <label>Frame height <input type="number" id="fh" value="700"></label>
    <label>Units per meter <input type="number" id="upm" value="10" step="any"></label>
  </fieldset>
  <fieldset>
    <legend>Underlay</legend>
    <input type="file" id="imgFile" accept="image/*">
    <label>x <input type="number" id="ux" value="0" step="any"></label>
    <label>y <input type="number" id="uy" value="0" step="any"></label>
    <label>Rotation (°) <input type="number" id="urot" value="0" step="any"></label>
    <label>Scale <input type="number" id="uscale" value="1" step="any"></label>
    <label>Visible <input type="checkbox" id="uvis" checked></label>
  </fieldset>
  <fieldset>
    <legend>Tools</legend>
    <button data-tool="pan">Pan</button>
    <button data-tool="underlay">Underlay</button>
    <button data-tool="line">Line</button>
    <button data-tool="text">Text</button>
    <button data-tool="select">Select</button>
    <label>Text <input type="text" id="textValue"></label>
    <label>Font size <input type="number" id="fontSize" value="12" step="any"></label>
    <button id="zoomIn">Zoom in</button>
    <button id="zoomOut">Zoom out</button>
    <button id="undo">Undo</button>
    <button id="del">Delete</button>
  </fieldset>
  <fieldset>
    <legend>File</legend>
    <button id="open">Open</button>
    <button id="save">Save</button>
    <input type="file" id="openFile" accept=".svg" hidden>
  </fieldset>
  <div id="msg"></div>
</div>
<svg id="view" xmlns="http://www.w3.org/2000/svg">
  <g id="underlays"></g>
  <g id="trace"></g>
  <g id="ui" pointer-events="none">
    <rect id="frame" fill="none" stroke="#c00" stroke-dasharray="6 4" vector-effect="non-scaling-stroke"/>
    <line id="preview" stroke="#0a0" stroke-width="1.5" vector-effect="non-scaling-stroke" visibility="hidden"/>
  </g>
</svg>
<script>
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const view = $('view'), gUnder = $('underlays'), gTrace = $('trace');
const frameRect = $('frame'), preview = $('preview');

// State: one underlay; the traced elements live directly in the DOM of gTrace
const under = { name: '', url: '', w: 0, h: 0, img: null };
let tool = 'line', startPt = null, selected = null, undoStack = [];

const num = id => parseFloat($(id).value) || 0;
const msg = t => { $('msg').textContent = t; };

function frame() { return { x: num('fx'), y: num('fy'), w: num('fw'), h: num('fh') }; }

function applyFrame() {
  const f = frame();
  frameRect.setAttribute('x', f.x); frameRect.setAttribute('y', f.y);
  frameRect.setAttribute('width', f.w); frameRect.setAttribute('height', f.h);
}

function fitCamera() {
  const f = frame();
  const m = Math.max(f.w, f.h) * 0.05;
  view.setAttribute('viewBox', `${f.x - m} ${f.y - m} ${f.w + 2 * m} ${f.h + 2 * m}`);
}

function underlayTransform() {
  return `translate(${num('ux')} ${num('uy')}) rotate(${num('urot')}) scale(${num('uscale')})`;
}

function renderUnderlay() {
  if (!under.img) return;
  under.img.setAttribute('transform', underlayTransform());
  under.img.setAttribute('display', $('uvis').checked ? 'inline' : 'none');
}

function setUnderlay(file) {
  if (under.url) URL.revokeObjectURL(under.url);
  under.name = file.name;
  under.url = URL.createObjectURL(file);
  const probe = new Image();
  probe.onload = () => {
    under.w = probe.naturalWidth; under.h = probe.naturalHeight;
    gUnder.textContent = '';
    under.img = document.createElementNS(NS, 'image');
    under.img.setAttribute('href', under.url);
    under.img.setAttribute('width', under.w);
    under.img.setAttribute('height', under.h);
    under.img.setAttribute('opacity', '0.6');
    gUnder.appendChild(under.img);
    if (!$('uscale').dataset.touched) $('uscale').value = (frame().w / under.w).toFixed(5);
    renderUnderlay();
    msg('Underlay loaded: ' + under.name);
  };
  probe.src = under.url;
}

function toSvg(ev) {
  const p = view.createSVGPoint();
  p.x = ev.clientX; p.y = ev.clientY;
  return p.matrixTransform(view.getScreenCTM().inverse());
}

// Snap to existing line ends within 8 screen pixels
function snap(p) {
  const tol = 8 / view.getScreenCTM().a;
  let best = null, bd = tol;
  for (const l of gTrace.querySelectorAll('line')) {
    for (const [x, y] of [[l.getAttribute('x1'), l.getAttribute('y1')], [l.getAttribute('x2'), l.getAttribute('y2')]]) {
      const d = Math.hypot(x - p.x, y - p.y);
      if (d < bd) { bd = d; best = { x: +x, y: +y }; }
    }
  }
  return best || p;
}

function addEl(el) {
  gTrace.appendChild(el);
  undoStack.push({ type: 'add', el });
}

function setSelected(el) {
  selected = el;
  refreshSel();
}
function refreshSel() {
  for (const e of gTrace.children) {
    const on = e === selected;
    if (e.tagName === 'line') e.setAttribute('stroke', on ? '#e60' : '#000');
    else e.setAttribute('fill', on ? '#e60' : '#000');
  }
}

function deleteSelected() {
  if (!selected) return;
  undoStack.push({ type: 'del', el: selected, next: selected.nextSibling });
  selected.remove();
  selected = null;
}

function undo() {
  const op = undoStack.pop();
  if (!op) return;
  if (op.type === 'add') { if (op.el === selected) selected = null; op.el.remove(); }
  else gTrace.insertBefore(op.el, op.next);
  refreshSel();
}

function setTool(t) {
  tool = t; startPt = null; preview.setAttribute('visibility', 'hidden');
  document.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('active', b.dataset.tool === t));
  view.style.cursor = { pan: 'grab', underlay: 'move', line: 'crosshair', text: 'text', select: 'default' }[t];
}

let drag = null;
view.addEventListener('pointerdown', ev => {
  const mid = ev.button === 1;
  if (tool === 'pan' || mid) {
    drag = { kind: 'pan', x: ev.clientX, y: ev.clientY };
  } else if (tool === 'underlay') {
    const p = toSvg(ev);
    drag = { kind: 'underlay', px: p.x, py: p.y, ux: num('ux'), uy: num('uy') };
  } else if (tool === 'line') {
    const p = snap(toSvg(ev));
    if (!startPt) {
      startPt = p;
      preview.setAttribute('x1', p.x); preview.setAttribute('y1', p.y);
      preview.setAttribute('x2', p.x); preview.setAttribute('y2', p.y);
      preview.setAttribute('visibility', 'visible');
    } else {
      const l = document.createElementNS(NS, 'line');
      l.setAttribute('x1', startPt.x); l.setAttribute('y1', startPt.y);
      l.setAttribute('x2', p.x); l.setAttribute('y2', p.y);
      l.setAttribute('stroke', '#000'); l.setAttribute('stroke-width', '1.5');
      l.setAttribute('vector-effect', 'non-scaling-stroke');
      addEl(l);
      startPt = null; preview.setAttribute('visibility', 'hidden');
    }
  } else if (tool === 'text') {
    const p = toSvg(ev);
    const s = $('textValue').value;
    if (!s) msg('Enter the text in the Text field first.');
    else {
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('x', p.x); t.setAttribute('y', p.y);
      t.setAttribute('font-size', num('fontSize')); t.setAttribute('fill', '#000');
      t.textContent = s;
      addEl(t);
    }
  } else if (tool === 'select') {
    const el = ev.target.closest('#trace > *');
    setSelected(el || null);
  }
});

view.addEventListener('pointermove', ev => {
  if (drag && drag.kind === 'pan') {
    const k = 1 / view.getScreenCTM().a;
    const vb = view.viewBox.baseVal;
    view.setAttribute('viewBox', `${vb.x - (ev.clientX - drag.x) * k} ${vb.y - (ev.clientY - drag.y) * k} ${vb.width} ${vb.height}`);
    drag.x = ev.clientX; drag.y = ev.clientY;
  } else if (drag && drag.kind === 'underlay') {
    const p = toSvg(ev);
    $('ux').value = (drag.ux + p.x - drag.px).toFixed(3);
    $('uy').value = (drag.uy + p.y - drag.py).toFixed(3);
    renderUnderlay();
  } else if (tool === 'line' && startPt) {
    const p = snap(toSvg(ev));
    preview.setAttribute('x2', p.x); preview.setAttribute('y2', p.y);
  }
});
window.addEventListener('pointerup', () => { drag = null; });

// Zoom around a point by factor f (f < 1 zooms in)
function zoomAt(p, f) {
  const vb = view.viewBox.baseVal;
  view.setAttribute('viewBox', `${p.x - (p.x - vb.x) * f} ${p.y - (p.y - vb.y) * f} ${vb.width * f} ${vb.height * f}`);
}

view.addEventListener('wheel', ev => {
  ev.preventDefault();
  zoomAt(toSvg(ev), ev.deltaY < 0 ? 0.85 : 1 / 0.85);
}, { passive: false });

function zoomCenter(f) {
  const vb = view.viewBox.baseVal;
  zoomAt({ x: vb.x + vb.width / 2, y: vb.y + vb.height / 2 }, f);
}
$('zoomIn').addEventListener('click', () => zoomCenter(0.7));
$('zoomOut').addEventListener('click', () => zoomCenter(1 / 0.7));

window.addEventListener('keydown', ev => {
  if (ev.target.tagName === 'INPUT') return;
  if (ev.key === 'Delete') deleteSelected();
  if (ev.key === 'Escape') { startPt = null; preview.setAttribute('visibility', 'hidden'); }
  if (ev.key === 'z' && ev.ctrlKey) undo();
});

// Controls
document.querySelectorAll('[data-tool]').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
$('undo').addEventListener('click', undo);
$('del').addEventListener('click', deleteSelected);
$('imgFile').addEventListener('change', e => { if (e.target.files[0]) setUnderlay(e.target.files[0]); });
['ux', 'uy', 'urot', 'uvis'].forEach(id => $(id).addEventListener('input', renderUnderlay));
$('uscale').addEventListener('input', () => { $('uscale').dataset.touched = '1'; renderUnderlay(); });
['fx', 'fy', 'fw', 'fh'].forEach(id => $(id).addEventListener('input', () => { applyFrame(); }));

// Save: frame as viewBox, underlay as a reference in its own group, traced elements in their own group
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }

function buildSvg() {
  const f = frame();
  const out = [];
  out.push(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${f.x} ${f.y} ${f.w} ${f.h}" data-floor-id="${esc($('floorId').value)}" data-level="${num('level')}" data-units-per-meter="${num('upm')}">`);
  out.push('  <g id="underlays">');
  if (under.name) {
    out.push(`    <image href="${esc(under.name)}" width="${under.w}" height="${under.h}" transform="${underlayTransform()}" opacity="0.6"${$('uvis').checked ? '' : ' display="none"'}/>`);
  }
  out.push('  </g>');
  out.push('  <g id="trace">');
  for (const e of gTrace.children) {
    if (e.tagName === 'line') {
      out.push(`    <line x1="${e.getAttribute('x1')}" y1="${e.getAttribute('y1')}" x2="${e.getAttribute('x2')}" y2="${e.getAttribute('y2')}" stroke="#000" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`);
    } else {
      out.push(`    <text x="${e.getAttribute('x')}" y="${e.getAttribute('y')}" font-size="${e.getAttribute('font-size')}" fill="#000">${esc(e.textContent)}</text>`);
    }
  }
  out.push('  </g>');
  out.push('</svg>');
  return out.join('\n') + '\n';
}

$('save').addEventListener('click', async () => {
  const text = buildSvg();
  const name = ($('floorId').value || 'plan') + '-plan.svg';
  try {
    // Inside an Artifact the page cannot download by itself; the downloads capability does it
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (dl) {
      await dl.save({ filename: name, data: text });
    } else if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: 'SVG', accept: { 'image/svg+xml': ['.svg'] } }] });
      const w = await h.createWritable();
      await w.write(text); await w.close();
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], { type: 'image/svg+xml' }));
      a.download = name; a.click();
    }
    msg('Saved.');
  } catch (e) { if (e.name !== 'AbortError' && e.code !== 'declined') msg('Error: ' + e.message); }
});

// Open: read frame, floor values, traced elements and underlay placement; the image file has to be picked again
$('open').addEventListener('click', () => $('openFile').click());
$('openFile').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  const doc = new DOMParser().parseFromString(await file.text(), 'image/svg+xml');
  const root = doc.documentElement;
  if (root.tagName !== 'svg') { msg('Not an SVG file.'); return; }
  const vb = (root.getAttribute('viewBox') || '0 0 1000 700').split(/[\s,]+/).map(Number);
  ['fx', 'fy', 'fw', 'fh'].forEach((id, i) => { $(id).value = vb[i]; });
  $('floorId').value = root.getAttribute('data-floor-id') || '';
  $('level').value = root.getAttribute('data-level') || 0;
  $('upm').value = root.getAttribute('data-units-per-meter') || 10;
  gTrace.textContent = ''; undoStack = []; selected = null;
  for (const el of doc.querySelectorAll('#trace > *')) {
    const n = document.createElementNS(NS, el.tagName);
    for (const a of el.attributes) n.setAttribute(a.name, a.value);
    n.textContent = el.tagName === 'text' ? el.textContent : '';
    gTrace.appendChild(n);
  }
  const img = doc.querySelector('#underlays > image');
  gUnder.textContent = ''; under.img = null; under.name = '';
  if (img) {
    const m = /translate\(([-\d.e]+)[ ,]+([-\d.e]+)\)\s*rotate\(([-\d.e]+)\)\s*scale\(([-\d.e]+)\)/.exec(img.getAttribute('transform') || '');
    if (m) { $('ux').value = m[1]; $('uy').value = m[2]; $('urot').value = m[3]; $('uscale').value = m[4]; $('uscale').dataset.touched = '1'; }
    $('uvis').checked = img.getAttribute('display') !== 'none';
    under.name = img.getAttribute('href');
    under.w = +img.getAttribute('width'); under.h = +img.getAttribute('height');
    msg('Please pick the underlay image again: ' + under.name);
  } else msg('Opened.');
  applyFrame(); fitCamera();
  e.target.value = '';
});

applyFrame(); fitCamera(); setTool('line');
</script>
</body>
</html>
